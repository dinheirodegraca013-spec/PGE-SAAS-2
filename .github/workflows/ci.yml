name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Offline inventory contract tests
        run: bun run test
      - name: PostgreSQL stock integration (disposable)
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: gestio_test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/estoque-local-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/pge2_estoque_base.sql
          psql -v ON_ERROR_STOP=1 -f supabase/proposals/pge2_estoque_transacional.sql
          psql -v ON_ERROR_STOP=1 -f tests/estoque-integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/estoque-auth-integration.sql
      - name: Production build
        run: bun run build
